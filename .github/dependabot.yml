version: 2
updates:
  # uv.lock is the lockfile of record; the uv ecosystem reads pyproject.toml + uv.lock,
  # so no second `pip` entry (a second way to bump the same dependencies).
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 10
    cooldown: { default-days: 2 }
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
    # nodriver is pinned `==` because its internals are monkeypatched (the CDP listener
    # and Transaction wrappers), so a bump is a migration, not a group update. 0.x minors
    # break it; the 0.50 migration is T-8501. Delete this entry when T-8501 lands.
    # GitHub's options reference does not say whether `ignore` also suppresses security
    # updates, so a nodriver advisory is NOT guaranteed to open a PR: watch the Security tab.
    ignore:
      - dependency-name: nodriver
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
  - package-ecosystem: npm            # root package.json holds husky only
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 10
    cooldown: { default-days: 2 }
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
  - package-ecosystem: github-actions # workflows pin actions by SHA; Dependabot keeps the pin and the version comment
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
