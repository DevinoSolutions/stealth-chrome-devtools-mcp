name: Security audit

on:
  pull_request:
    branches: ['**']
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

jobs:
  # JS side: the root package.json holds husky only. The org workflow audits
  # package-lock.json and the stale-override table.
  js-audit:
    uses: DevinoSolutions/.github/.github/workflows/security-audit.yml@0f0d46183478802c4e1f2bd51580afa48518c1e8 # main
    with:
      package-manager: npm
      runner: ubuntu-latest

  # Python side: the org workflow does not read uv.lock, so audit the locked set.
  python-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install uv
        uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
      - name: Export the locked requirements
        run: uv export --frozen --no-hashes --all-extras --no-emit-project -o "$RUNNER_TEMP/locked-requirements.txt"
      - name: pip-audit the locked set
        run: uvx pip-audit --requirement "$RUNNER_TEMP/locked-requirements.txt" --no-deps --disable-pip
