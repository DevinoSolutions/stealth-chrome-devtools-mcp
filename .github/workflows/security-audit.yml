name: Security audit

on:
  pull_request:
    branches: ['**']
    # Only a PR that changes the locked set (or this workflow) can introduce a
    # vulnerable dependency; the weekly run catches advisories published later.
    paths:
      - uv.lock
      - pyproject.toml
      - package.json
      - package-lock.json
      - .github/workflows/security-audit.yml
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # JS side: the root package.json holds husky only, as a devDependency, so the
  # audit must include dev dependencies or it audits nothing. DevinoSolutions/.github
  # is private, so this public repo cannot call its reusable workflow; audit inline.
  js-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: npm audit (locked dependencies)
        run: npm audit --package-lock-only --audit-level=high

  # Python side: the org workflow does not read uv.lock, so audit the locked set.
  python-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Export the locked requirements
        run: uv export --frozen --no-hashes --all-extras --no-emit-project -o "$RUNNER_TEMP/locked-requirements.txt"
      - name: pip-audit the locked set
        run: uvx pip-audit==2.10.1 --requirement "$RUNNER_TEMP/locked-requirements.txt" --no-deps --disable-pip
