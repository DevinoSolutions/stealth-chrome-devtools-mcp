name: Security audit

on:
  pull_request:
    branches: ['**']
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # JS side: the root package.json holds husky only. DevinoSolutions/.github is
  # private, so this public repo cannot call its reusable workflow; audit inline.
  js-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: npm audit (production dependencies)
        run: npm audit --package-lock-only --omit=dev --audit-level=high

  # Python side: the org workflow does not read uv.lock, so audit the locked set.
  python-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install uv
        uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
      - name: Export the locked requirements
        run: uv export --frozen --no-hashes --all-extras --no-emit-project -o "$RUNNER_TEMP/locked-requirements.txt"
      - name: pip-audit the locked set
        run: uvx pip-audit==2.10.1 --requirement "$RUNNER_TEMP/locked-requirements.txt" --no-deps --disable-pip
