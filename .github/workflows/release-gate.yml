name: release-gate

# The ONE reusable release gate (plan_RELEASE W2). test.yml (PR/push) and, later,
# publish.yml (tags, W3) both CALL this workflow — job semantics live here only,
# never duplicated into a second YAML source of truth. The gate qualifies exactly
# three GitHub-hosted cells (Ubuntu x64, Windows x64, macOS ARM64) and exposes one
# stable aggregate check, `release-gate`, that a repository ruleset can require.
#
# Edge inventory (W2): plan (T-6910), quality, unit-tests, coverage, integration, transport,
# offline-stealth. W3 adds build-dist, package-verify, install-smoke; W5 adds
# release-evidence. Each new edge slots into the aggregate's `needs:` list — the
# aggregate is never replaced and never forgets a direct edge.
#
# W3 topology (gap G-C): the distribution is built EXACTLY ONCE, in `build-dist`,
# which hashes it into a manifest and uploads it as the run's one immutable
# `dist` artifact. `package-verify` and every `install-smoke` cell DOWNLOAD that
# artifact and re-check its hashes; none of them runs `uv build`, rebuilds from
# the checkout, or fetches the same version from PyPI. `publish.yml` calls this
# same workflow at the tag SHA and uploads those very files.

on:
  workflow_call:
    inputs:
      ref:
        description: >-
          Git ref/SHA to check out. Empty (default) checks out the event's
          default ref; W3 passes the exact tag SHA so the gate tests the same
          commit it will build and publish.
        type: string
        required: false
        default: ""
      release_tag:
        description: >-
          Release tag being qualified (``v1.2.0``/``refs/tags/v1.2.0``). When
          non-empty, `build-dist` fails unless the built artifact's metadata
          version equals it — so a tag/version disagreement is caught by the
          gate itself, before any publish job can run.
        type: string
        required: false
        default: ""
    outputs:
      version:
        description: The version recorded in this run's build manifest.
        value: ${{ jobs.build-dist.outputs.version }}

permissions:
  id-token: write
  contents: read

jobs:
  # ── Lint / type / static gates (OS-independent → one cell) ──────────────────
  # T-6910: the cells have ONE home, tools/release_evidence.py. `plan` asks it which
  # matrices this event runs (a pull_request runs the PR tier: Linux only, wheel
  # only, plus ONE advisory Windows py3.11 unit cell, T-8242; pushes to main, tags
  # and manual runs run every REQUIRED_CELLS cell) and
  # each matrix job reads its slice through fromJSON. The release-evidence
  # aggregate derives the SAME tier from the same event, so a tag still owes every
  # cell and a PR is never credited with a cell it did not run.
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.plan.outputs.tier }}
      unit_tests: ${{ steps.plan.outputs.unit_tests }}
      coverage: ${{ steps.plan.outputs.coverage }}
      integration: ${{ steps.plan.outputs.integration }}
      transport: ${{ steps.plan.outputs.transport }}
      offline_stealth: ${{ steps.plan.outputs.offline_stealth }}
      install_smoke: ${{ steps.plan.outputs.install_smoke }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
      - name: Plan the matrices for this event
        id: plan
        shell: bash
        run: python3 tools/release_evidence.py plan --event "${{ github.event_name }}" | tee -a "$GITHUB_OUTPUT"

  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
      - name: Install uv
        uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: ruff format --check
        run: uv run ruff format --check
      - name: ruff check
        run: uv run ruff check
      - name: ty check
        run: uv run ty check --exit-zero-on-warning src/stealth_chrome_devtools_mcp/
      - name: vulture
        run: uv run vulture src/stealth_chrome_devtools_mcp/ tools/vulture_allowlist.py
      - name: check suppression owners
        run: uv run python tools/check_suppression_owners.py
      - name: check file budgets
        run: uv run python tools/check_file_budgets.py
      - name: check pinned imports (F-865)
        run: uv run python tools/check_pinned_imports.py
      - name: The generated release contract is not stale
        # W5: RELEASE_CONTRACT.md is generated from the ledger's required cells,
        # the per-tool claim ledger and the live registry. Drift is a red gate,
        # never a document that quietly stops matching the code.
        run: uv run python tools/gen_release_contract.py --check
      - name: Assert qualified runner + record identity
        shell: bash
        run: >-
          python3 tools/runner_identity.py
          --runner-os "${{ runner.os }}" --runner-arch "${{ runner.arch }}"
          --runner-name "${{ runner.name }}" --expect-os "Linux"
          --expect-arch "X64" --out "runner-identity.json"
      - name: Emit this cell's release-evidence record
        # W5: `always()` so a RED cell still writes a record saying it was
        # red. The aggregate rejects any non-success terminal outcome, so
        # this edge can only ever make the gate redder, never greener.
        if: always()
        shell: bash
        run: >-
          python3 tools/release_evidence.py emit
          --release-sha "$(git rev-parse HEAD)"
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --event "${{ github.event_name }}"
          --job-id quality --matrix-cell "default"
          --terminal-outcome "${{ job.status }}"
          --runner-identity "runner-identity.json"
          --artifact "runner-identity=runner-identity.json"
      - name: Upload this cell's release-evidence record
        if: always()
        uses: DevinoSolutions/artifact/upload@44df16680dcb504375db03d284d75808db18e4ed # v1.2.1
        with:
          name: release-evidence-quality
          path: release-evidence
          if-no-files-found: error

  # ── Unit tests on all three OSes, py3.11 and py3.13, plus one Linux py3.14 cell ─────────────
  # py3.12 is NOT in this matrix: the `coverage` job below runs the SAME
  # `-m "not integration"` suite on py3.12 on each OS, with the coverage floor, so a
  # second py3.12 run here would execute the whole suite twice on the same cell
  # (T-6149). The ledger still owes a py3.12 pytest record per OS — `coverage/<os>`.
  unit-tests:
    needs: plan
    name: unit-tests (${{ matrix.runner_os }}/${{ matrix.runner_arch }} py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    # T-8242: the ONE continue-on-error in this file, and the plan decides it. A
    # pull request also runs a cell it does not owe (Windows py3.11, which the
    # Linux-only PR tier never saw); the plan flags it `advisory`, so its failure
    # shows red on that cell but leaves this job's result, and so `release-gate`,
    # green. The aggregate neither requires nor reads its record. Every cell the
    # full tier runs is un-flagged, so a tag still fails on any red cell.
    continue-on-error: ${{ matrix.advisory == true }}
    # The org runner pool is shared (28 runners) and one run once held 15 of them.
    # unit-tests 3 at a time, every other matrix 2, in two waves (integration,
    # transport, offline-stealth and install-smoke wait for unit-tests and coverage):
    # peak about 9 runners, about 60 min per run (T-6909).
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.unit_tests) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
      - name: Install uv
        uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked --extra test --extra sentry
      - name: Assert qualified runner + record identity
        shell: bash
        run: >-
          uv run python tools/runner_identity.py
          --runner-os "${{ runner.os }}" --runner-arch "${{ runner.arch }}"
          --runner-name "${{ runner.name }}" --expect-os "${{ matrix.runner_os }}"
          --expect-arch "${{ matrix.runner_arch }}"
          --python "${{ matrix.python-version }}"
          --out "runner-identity.json"
      - name: Upload runner identity
        uses: DevinoSolutions/artifact/upload@44df16680dcb504375db03d284d75808db18e4ed # v1.2.1
        with:
          name: runner-identity-unit-${{ matrix.runner_os }}-${{ matrix.runner_arch }}-py${{ matrix.python-version }}
          path: runner-identity.json
      - name: Run unit tests
        shell: bash
        run: >-
          uv run pytest -m "not integration" -v --tb=short
          --junitxml=junit.xml -o junit_family=xunit1
      - name: Emit this cell's release-evidence record
        # W5: `always()` so a RED cell still writes a record saying it was
        # red. The aggregate rejects any non-success terminal outcome, so
        # this edge can only ever make the gate redder, never greener.
        if: always()
        shell: bash
        run: >-
          uv run python tools/release_evidence.py emit
          --release-sha "$(git rev-parse HEAD)"
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --event "${{ github.event_name }}"
          --job-id unit-tests --matrix-cell "${{ matrix.runner_os }}-${{ matrix.runner_arch }}-py${{ matrix.python-version }}"
          --terminal-outcome "${{ job.status }}"
          --runner-identity "runner-identity.json"
          --junit "junit.xml"
          --artifact "junit=junit.xml"
          --artifact "runner-identity=runner-identity.json"
          --mq "MQ-130"
      - name: Upload this cell's release-evidence record
        if: always()
        uses: DevinoSolutions/artifact/upload@44df16680dcb504375db03d284d75808db18e4ed # v1.2.1
        with:
          name: release-evidence-unit-${{ matrix.runner_os }}-${{ matrix.runner_arch }}-py${{ matrix.python-version }}
          path: release-evidence
          if-no-files-found: error

  coverage:
    needs: plan
    name: coverage (${{ matrix.runner_os }}/${{ matrix.runner_arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.coverage) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
      - name: Install uv
        uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --locked --extra test --extra sentry
      - name: Assert qualified runner + record identity
        shell: bash
        run: >-
          uv run python tools/runner_identity.py
          --runner-os "${{ runner.os }}" --runner-arch "${{ runner.arch }}"
          --runner-name "${{ runner.name }}" --expect-os "${{ matrix.runner_os }}"
          --expect-arch "${{ matrix.runner_arch }}" --python "3.12"
          --out "runner-identity.json"
      - name: Run unit tests with coverage floor
        # CI path form of --cov (NOT the module form: the module form mis-resolves
        # the editable install to a false ~53%). Same reviewed floor on every OS;
        # each OS uploads its OWN report — no Linux-only or merged-that-hides-red.
        shell: bash
        run: >-
          uv run pytest -m "not integration" -v --tb=short
          --cov=src/stealth_chrome_devtools_mcp
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-fail-under=55
          --junitxml=junit.xml -o junit_family=xunit1
      - name: Upload coverage report + runner identity
        uses: DevinoSolutions/artifact/upload@44df16680dcb504375db03d284d75808db18e4ed # v1.2.1
        with:
          name: coverage-${{ matrix.runner_os }}-${{ matrix.runner_arch }}
          path: |
            coverage.xml
            runner-identity.json
      - name: Emit this cell's release-evidence record
        # W5: `always()` so a RED cell still writes a record saying it was
        # red. The aggregate rejects any non-success terminal outcome, so
        # this edge can only ever make the gate redder, never greener.
        if: always()
        shell: bash
        run: >-
          uv run python tools/release_evidence.py emit
          --release-sha "$(git rev-parse HEAD)"
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --event "${{ github.event_name }}"
          --job-id coverage --matrix-cell "${{ matrix.runner_os }}-${{ matrix.runner_arch }}"
          --terminal-outcome "${{ job.status }}"
          --runner-identity "runner-identity.json"
          --junit "junit.xml"
          --artifact "coverage=coverage.xml"
          --artifact "junit=junit.xml"
          --artifact "runner-identity=runner-identity.json"
      - name: Upload this cell's release-evidence record
        if: always()
        uses: DevinoSolutions/artifact/upload@44df16680dcb504375db03d284d75808db18e4ed # v1.2.1
        with:
          name: release-evidence-coverage-${{ matrix.runner_os }}-${{ matrix.runner_arch }}
          path: release-evidence
          if-no-files-found: error

  # ── Real-Chrome evidence on all three OSes ─────────────────────────────────
  integration:
    needs: [plan, unit-tests, coverage]
    name: integration (${{ matrix.runner_os }}/${{ matrix.runner_arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.integration) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
      - name: Install uv
        uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --locked --extra test --extra sentry
      - name: Assert qualified runner + record identity
        shell: bash
        run: >-
          uv run python tools/runner_identity.py
          --runner-os "${{ runner.os }}" --runner-arch "${{ runner.arch }}"
          --runner-name "${{ runner.name }}" --expect-os "${{ matrix.runner_os }}"
          --expect-arch "${{ matrix.runner_arch }}" --python "3.12"
          --out "runner-identity.json"
      - name: Resolve image Chrome Stable identity
        # F-819: --freeze-updater neutralises the image's background Chrome
        # updater BEFORE the version is read, so the identity recorded here is
        # the identity the browser this job launches will still report. Without
        # it, macOS Keystone can swap Chrome Stable mid-run and the CDP
        # comparison in TestChromeIdentity fails on two different binaries.
        shell: bash
        run: uv run python tools/resolve_chrome.py --freeze-updater --out chrome-identity.json
      - name: Start Xvfb (Linux headed cases only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset &
          sleep 3
      - name: 'KNOWN GAP: macOS excludes the transport journey (F-773)'
        if: runner.os == 'macOS'
        run: |
          echo "::warning title=F-773::macOS runs 'integration and not transport'."
          echo "::warning title=F-773::Chrome under the DETACHED backend cannot complete any network navigation on this runner (a connection to a CLOSED port hangs 35s while about:blank returns in 1.1s). Cause unknown; see audit/stage2/finding_F773_macos_detached_navigation.md. This gate therefore makes NO macOS navigation claim."
      - name: Chrome cold-start probe (F-870)
        # THE one description of this step; the other three cells point here.
        #
        # Measures how long THIS runner's Chrome takes to open its DevTools
        # endpoint — twice, back to back, product-free. F-870 established that
        # the POSIX gate's intermittent "Failed to connect to browser" is
        # nodriver spending its hardcoded 2.75 s connect window in full against
        # a Chrome that is alive and simply not listening yet, but it could not
        # measure what that launch actually costs: our own F-860 reaper kills
        # the browser 2.8 s in, and nodriver pipes Chrome's stderr and never
        # reads it, so "DevTools listening on ws://" appears in ZERO of ~100
        # sampled job logs. This step is that missing measurement. The launch
        # #1 vs #2 delta is what separates a cold page-in cost from machine
        # contention (finding §3.4/§7).
        #
        # Placed AFTER "Resolve image Chrome Stable identity" so --freeze-updater
        # has already run and Chrome cannot be swapped under the measurement,
        # and BEFORE the first step that launches Chrome through the product, so
        # launch #1 is this job's first Chrome and sits exactly where the
        # product's own first spawn would.
        #
        # Runs on EVERY cell INCLUDING Windows. Windows is F-870's control, and
        # "0 of 27 failed Windows cells" is absence of evidence; a measured
        # number is evidence of absence. Cost is well under a second per launch
        # on a warm machine — /json/version at 340/322 ms and 379/333 ms across
        # two runs on ONE Windows box (n=2, one machine; the gate is what will
        # produce the actual distribution).
        #
        # No continue-on-error — test_no_gate_job_hides_failure forbids it and
        # it is not needed: the script exits 0 on every path by contract, and a
        # launch that never listens inside the deadline is itself the answer.
        shell: bash
        run: >-
          uv run python tools/chrome_cold_start_probe.py
          --cell "${{ matrix.runner_os }}-${{ matrix.runner_arch }}"
          --out "chrome-cold-start.json"
      - name: Run integration + Chrome-identity tests
        # Headless cases must not depend on DISPLAY; Linux sets it only for the
        # headed cases that need Xvfb, and Windows/macOS never inherit :99.
        # Session root: runner-native temp — no hard-coded /tmp or separators
        # (plan_RELEASE §2.2). Step-level env because the `runner` context is
        # not available in job-level env (actionlint [expression]).
        #
        # macOS deselects `transport` — NOT to make the gate green, but because
        # F-773 is an open, unexplained failure that the gate must report as a
        # gap rather than either hide or pretend to cover. The step above prints
        # it on every macOS run so a green gate can never be read as "macOS
        # navigation verified".
        #
        # --timeout=300, not 180: the startup herd's own backstop is 240s
        # (HERD_HARD_TIMEOUT_SECONDS), so a wedged herd was being killed by
        # pytest-timeout at 180s BEFORE it could report — no test name, no
        # junit.xml, and a second red from release_evidence's `pytest: null`
        # that was pure consequence (F-859 §7.2; same class as F-780). The
        # transport cell already runs at 300.
        shell: bash
        run: >-
          uv run pytest
          -m "${{ runner.os == 'macOS' && 'integration and not transport' || 'integration' }}"
          -v --tb=short --timeout=300
          --junitxml=junit.xml -o junit_family=xunit1
        env:
          DISPLAY: ${{ runner.os == 'Linux' && ':99' || '' }}
          STEALTH_MCP_BROWSER_SESSION_ROOT: ${{ runner.temp }}/stealth-mcp-session-root
      - name: Upload Chrome + runner identity
        if: always()
        uses: DevinoSolutions/artifact/upload@44df16680dcb504375db03d284d75808db18e4ed # v1.2.1
        with:
          name: identity-integration-${{ matrix.runner_os }}-${{ matrix.runner_arch }}
          path: |
            chrome-cold-start.json
            chrome-identity.json
            runner-identity.json
      - name: Emit this cell's release-evidence record
        # W5: `always()` so a RED cell still writes a record saying it was
        # red. The aggregate rejects any non-success terminal outcome, so
        # this edge can only ever make the gate redder, never greener.
        #
        # W7's and W10's `--mq` ids below are emitted by THIS cell because it is
        # the one that runs them: `tests/test_e2e_dynamic_sites.py` and
        # `tests/test_resilience.py` are both `integration`-marked, so the unit
        # lane deselects every one of those nodes and only this job's junit.xml
        # carries their outcome.
        #
        # id -> node. Eight shapes, nine nodes: MQ-116 is deliberately split so
        # a failure names which half broke, and it needs BOTH halves to pass.
        #   MQ-114 test_spa_history_route_swap_and_requery
        #   MQ-115 test_cross_origin_a_b_a_direct_metadata_and_limit
        #   MQ-116 test_intersection_observer_lazy_load
        #        + test_virtualized_and_finite_infinite_lists   <- both required
        #   MQ-117 test_strict_csp_surface
        #   MQ-118 test_auth_redirect_cors_preflight
        #   MQ-119 test_completed_text_base64_binary_chunked_and_http_errors
        #   MQ-120 test_sse_and_websocket_lifecycle
        #   MQ-121 test_custom_elements_slots_and_popup_lifecycle
        #
        # W10 (tests/test_resilience.py). Four faults, eight nodes — THREE ids
        # are bound, because three of the four contracts hold:
        #   MQ-127 test_tab_closed_under_a_running_tool_has_one_terminal_outcome
        #   MQ-128 test_a_navigation_timeout_leaves_the_instance_usable
        #          (+ the two ..._times_out_with_the_pinned_message nodes and
        #           test_slow_success_control_completes_when_released)
        #   MQ-129 test_route_abort_mid_navigation_is_bounded_and_recoverable
        #
        # MQ-128 joined them here, in the SAME commit that closed F-788 — which
        # is what the note this replaces asked for. A navigation timeout used to
        # leave the instance's CDP connection permanently wedged; the cause was
        # never the deadline but a cancelled await taking nodriver's Transaction
        # down with it, and it is fixed in embedded/cdp_transport.py. The
        # characterization pin that carried the defect is now
        # test_a_navigation_timeout_leaves_the_instance_usable and asserts the
        # full recovery invariant, so the step's second half is real evidence
        # rather than a pin bound to a step it does not satisfy.
        #
        # MQ-126 is still deliberately NOT emitted yet: F-789 (close_instance
        # returned False for a browser that is already gone) is fixed by F-1022,
        # but the step has not been promoted; it remains characterization-pinned
        # and `planned` in tests/MANUAL_QA_PROTOCOL.md. Emitting it here
        # would bind a passing pin to a step it does not satisfy, which is
        # exactly the "count declarations as behavior" cheat plan_RELEASE §8.1
        # refuses. Add it in the SAME commit that promotes the
        # step.
        #
        # W16 (tests/test_stateful_i18n.py). Eight shapes, eleven nodes; seven
        # ids are bound:
        #   MQ-155 test_dedicated_worker_answers_in_order_then_closes
        #   MQ-156 test_shared_worker_is_shared_across_tabs_then_reports_zero
        #        + test_a_separate_profile_gets_its_own_shared_worker_state
        #                                                  <- both required
        #   MQ-158 test_cache_bytes_and_offline_reads_match_the_byte_oracle
        #   MQ-159 test_indexed_db_index_and_transaction_results_match_the_oracle
        #   MQ-160 test_storage_and_cookies_survive_one_profile_and_no_other
        #        <- NOT emitted on Linux: F-801 makes that node xfail there, and
        #           an xfail is not a pass, so Linux may not claim the step.
        #   MQ-161 test_unicode_round_trips_through_text_attributes_and_inputs
        #   MQ-162 test_the_synthesized_composition_sequence_is_exact
        #
        # MQ-157 is deliberately NOT emitted. reload_page discards its
        # ignore_cache argument, so nodriver's ignore_cache=True default makes
        # every reload a hard reload and the reloaded document is uncontrolled
        # by its own service worker (F-800) — and "controlled reload" is one of
        # that step's named halves. Its pin
        # (test_reload_page_leaves_the_service_worker_page_uncontrolled) passes
        # today precisely BECAUSE the defect is present; binding it would bind a
        # green pin to a step it contradicts. Add MQ-157 in the SAME commit that
        # closes F-800 and promotes the step.
        if: always()
        shell: bash
        run: >-
          uv run python tools/release_evidence.py emit
          --release-sha "$(git rev-parse HEAD)"
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --event "${{ github.event_name }}"
          --job-id integration --matrix-cell "${{ matrix.runner_os }}-${{ matrix.runner_arch }}"
          --terminal-outcome "${{ job.status }}"
          --runner-identity "runner-identity.json"
          --chrome-identity "chrome-identity.json"
          --chrome-launched
          --junit "junit.xml"
          --artifact "chrome-cold-start=chrome-cold-start.json"
          --artifact "chrome-identity=chrome-identity.json"
          --artifact "junit=junit.xml"
          --artifact "runner-identity=runner-identity.json"
          --mq "MQ-114"
          --mq "MQ-115"
          --mq "MQ-116"
          --mq "MQ-117"
          --mq "MQ-118"
          --mq "MQ-119"
          --mq "MQ-120"
          --mq "MQ-121"
          --mq "MQ-127"
          --mq "MQ-128"
          --mq "MQ-129"
          --mq "MQ-155"
          --mq "MQ-156"
          --mq "MQ-158"
          --mq "MQ-159"
          ${{ runner.os != 'Linux' && '--mq "MQ-160"' || '' }}
          --mq "MQ-161"
          --mq "MQ-162"
      - name: Upload this cell's release-evidence record
        if: always()
        uses: DevinoSolutions/artifact/upload@44df16680dcb504375db03d284d75808db18e4ed # v1.2.1
        with:
          name: release-evidence-integration-${{ matrix.runner_os }}-${{ matrix.runner_arch }}
          path: release-evidence
          if-no-files-found: error

  # The real-stdio journey. Linux/X64 and Windows/X64 only: macOS/ARM64 is a
  # KNOWN GAP (F-773 — Chrome under the detached backend completes no network
  # navigation on the hosted macOS runner; cause unknown after eliminating cold
  # start, tab/CDP health, reachability, Fetch interception, profile location,
  # the network-service process, and Chrome errors). The cell is EXCLUDED, not
  # xfail-quarantined: an xfail would let a green gate imply macOS coverage.
  # `known-gaps` below states the gap in the job list, so it is
  # visible without reading this file. Re-add the cell the moment F-773 closes —
  # `finding_F773_macos_detached_navigation.md` §7 is the experiment that does it.
  transport:
    needs: [plan, unit-tests, coverage]
    name: transport (${{ matrix.runner_os }}/${{ matrix.runner_arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.transport) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
      - name: Install uv
        uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --locked --extra test --extra sentry
      - name: Assert qualified runner + record identity
        shell: bash
        run: >-
          uv run python tools/runner_identity.py
          --runner-os "${{ runner.os }}" --runner-arch "${{ runner.arch }}"
          --runner-name "${{ runner.name }}" --expect-os "${{ matrix.runner_os }}"
          --expect-arch "${{ matrix.runner_arch }}" --python "3.12"
          --out "runner-identity.json"
      - name: Resolve image Chrome Stable identity
        # F-819: --freeze-updater neutralises the image's background Chrome
        # updater BEFORE the version is read, so the identity recorded here is
        # the identity the browser this job launches will still report. Without
        # it, macOS Keystone can swap Chrome Stable mid-run and the CDP
        # comparison in TestChromeIdentity fails on two different binaries.
        shell: bash
        run: uv run python tools/resolve_chrome.py --freeze-updater --out chrome-identity.json
      - name: Start Xvfb (Linux headed cases only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset &
          sleep 3
      - name: Chrome cold-start probe (F-870)
        # See the `integration` job's copy of this step for the full rationale.
        # Same placement rule: after the frozen identity resolve, before the
        # first product Chrome launch, exits 0 on every path.
        shell: bash
        run: >-
          uv run python tools/chrome_cold_start_probe.py
          --cell "${{ matrix.runner_os }}-${{ matrix.runner_arch }}"
          --out "chrome-cold-start.json"
      - name: Run real-stdio transport journey
        # Session root at step level for the same runner-context reason as the
        # integration job above.
        shell: bash
        run: >-
          uv run pytest -m transport -v --tb=short --timeout=300
          --junitxml=junit.xml -o junit_family=xunit1
        env:
          DISPLAY: ${{ runner.os == 'Linux' && ':99' || '' }}
          STEALTH_MCP_BROWSER_SESSION_ROOT: ${{ runner.temp }}/stealth-mcp-session-root
      - name: Upload Chrome + runner identity
        if: always()
        uses: DevinoSolutions/artifact/upload@44df16680dcb504375db03d284d75808db18e4ed # v1.2.1
        with:
          name: identity-transport-${{ matrix.runner_os }}-${{ matrix.runner_arch }}
          path: |
            chrome-cold-start.json
            chrome-identity.json
            runner-identity.json
      - name: Emit this cell's release-evidence record
        # W5: `always()` so a RED cell still writes a record saying it was
        # red. The aggregate rejects any non-success terminal outcome, so
        # this edge can only ever make the gate redder, never greener.
        #
        # W13's `--mq` ids are emitted by THIS cell, not the `integration` one,
        # because `tests/test_wire_semantics.py` is `transport`-marked and the
        # integration cell deselects `transport` on macOS (F-773). Only this
        # job's junit.xml carries those nodes' outcome on every cell it runs.
        #
        # id -> node. Seven steps, five bound; MQ-139 and MQ-140 each need BOTH
        # of their nodes to pass.
        #   MQ-138 test_the_official_mcp_sdk_client_initializes_lists_calls_and_closes
        #   MQ-139 test_concurrent_calls_on_one_instance_keep_their_own_answers
        #        + test_two_named_instances_stay_isolated_under_interleaved_calls
        #   MQ-140 test_reversed_completion_keeps_each_result_on_its_own_request
        #        + test_duplicate_looking_payloads_are_told_apart_only_by_id
        #   MQ-142 test_client_disconnect_with_a_request_in_flight_has_one_outcome
        #   MQ-144 test_shutdown_with_an_in_flight_call_leaves_no_orphan
        #
        # MQ-141 and MQ-143 are deliberately NOT emitted. Their measurements
        # found real defects in the half each step names — a cancelled request
        # is answered with JSON-RPC code 0 and leaves its instance wedged
        # (F-791, F-794), and malformed input gets no protocol reply at all
        # (F-792) — so those steps are `planned` in tests/MANUAL_QA_PROTOCOL.md.
        # Emitting their ids here would bind a passing characterization pin to a
        # step it does not satisfy, which is exactly the "count declarations as
        # behavior" cheat plan_RELEASE §8.1 refuses. Add them in the SAME commit
        # that closes F-791/F-792/F-794 and promotes the steps.
        if: always()
        shell: bash
        run: >-
          uv run python tools/release_evidence.py emit
          --release-sha "$(git rev-parse HEAD)"
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --event "${{ github.event_name }}"
          --job-id transport --matrix-cell "${{ matrix.runner_os }}-${{ matrix.runner_arch }}"
          --terminal-outcome "${{ job.status }}"
          --runner-identity "runner-identity.json"
          --chrome-identity "chrome-identity.json"
          --chrome-launched
          --junit "junit.xml"
          --artifact "chrome-cold-start=chrome-cold-start.json"
          --artifact "chrome-identity=chrome-identity.json"
          --artifact "junit=junit.xml"
          --artifact "runner-identity=runner-identity.json"
          --mq "MQ-138"
          --mq "MQ-139"
          --mq "MQ-140"
          --mq "MQ-142"
          --mq "MQ-144"
      - name: Upload this cell's release-evidence record
        if: always()
        uses: DevinoSolutions/artifact/upload@44df16680dcb504375db03d284d75808db18e4ed # v1.2.1
        with:
          name: release-evidence-transport-${{ matrix.runner_os }}-${{ matrix.runner_arch }}
          path: release-evidence
          if-no-files-found: error

  # ── The gate's own honesty surface ─────────────────────────────────────────
  # A required check whose ONLY job is to name what the gate does not verify, in
  # the check list where a reviewer reads it — so coverage gaps cost a visible
  # line rather than living only in a YAML comment. It passes: it reports, it
  # does not judge. Delete a line here only when the gap actually closes.
  # Renamed from `transport-known-gaps` in W3: the same root cause now bounds a
  # second lane (install-smoke), and gap declarations get ONE home, not two.
  known-gaps:
    name: known-gaps
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
      - name: Assert qualified runner + record identity
        shell: bash
        run: >-
          python3 tools/runner_identity.py
          --runner-os "${{ runner.os }}" --runner-arch "${{ runner.arch }}"
          --runner-name "${{ runner.name }}" --expect-os "Linux"
          --expect-arch "X64" --out "runner-identity.json"
      - name: State the gaps
        run: |
          echo "::warning title=F-773::transport (macOS/ARM64) is NOT run. Chrome under the detached backend completes no network navigation on the hosted macOS runner. Cause unknown; 11 CI rounds, full elimination table in audit/stage2/finding_F773_macos_detached_navigation.md. Unknown whether real Macs are affected -- that needs a run on real hardware."
          echo "::warning title=F-773::install-smoke (macOS/ARM64) runs as a PARTIAL cell for BOTH wheel and sdist: install + launcher resolve + initialize + tools/list + list_instances, and NO navigation. W3 confirmed F-773 reaches this lane from a FRESH INSTALL of the built artifacts, not just from the checkout."
          echo "FULL-JOURNEY (navigating) coverage in this gate:"
          echo "  transport      : Linux/X64, Windows/X64"
          echo "  install-smoke  : Linux/X64, Windows/X64 -- wheel AND sdist (4 full cells)"
          echo "PARTIAL, NON-NAVIGATING coverage:"
          echo "  install-smoke  : macOS/ARM64 -- wheel AND sdist (2 install+handshake cells)"
          echo "This gate makes NO claim about macOS navigation. Do not advertise one."
          echo "It DOES claim the built artifacts install and serve on macOS/ARM64."
          echo "TOOL SURFACE: see RELEASE_CONTRACT.md -- the per-tool table is"
          echo "  generated from the ledger, and at this SHA the release-qualified"
          echo "  count is what the evidence supports, not the number of tools served."
      - name: Emit this cell's release-evidence record
        # W5: `always()` so a RED cell still writes a record saying it was
        # red. The aggregate rejects any non-success terminal outcome, so
        # this edge can only ever make the gate redder, never greener.
        if: always()
        shell: bash
        run: >-
          python3 tools/release_evidence.py emit
          --release-sha "$(git rev-parse HEAD)"
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --event "${{ github.event_name }}"
          --job-id known-gaps --matrix-cell "default"
          --terminal-outcome "${{ job.status }}"
          --runner-identity "runner-identity.json"
          --artifact "runner-identity=runner-identity.json"
      - name: Upload this cell's release-evidence record
        if: always()
        uses: DevinoSolutions/artifact/upload@44df16680dcb504375db03d284d75808db18e4ed # v1.2.1
        with:
          name: release-evidence-known-gaps
          path: release-evidence
          if-no-files-found: error

  # ── Offline stealth lane (W2 wires the edge; W4 lands the tests) ───────────
  offline-stealth:
    needs: [plan, unit-tests, coverage]
    name: offline-stealth (${{ matrix.runner_os }}/${{ matrix.runner_arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.offline_stealth) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
      - name: Install uv
        uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --locked --extra test --extra sentry
      - name: Assert qualified runner + record identity
        shell: bash
        run: >-
          uv run python tools/runner_identity.py
          --runner-os "${{ runner.os }}" --runner-arch "${{ runner.arch }}"
          --runner-name "${{ runner.name }}" --expect-os "${{ matrix.runner_os }}"
          --expect-arch "${{ matrix.runner_arch }}" --python "3.12"
          --out "runner-identity.json"
      - name: Resolve image Chrome Stable identity
        # F-819: --freeze-updater neutralises the image's background Chrome
        # updater BEFORE the version is read, so the identity recorded here is
        # the identity the browser this job launches will still report. Without
        # it, macOS Keystone can swap Chrome Stable mid-run and the CDP
        # comparison in TestChromeIdentity fails on two different binaries.
        shell: bash
        run: uv run python tools/resolve_chrome.py --freeze-updater --out chrome-identity.json
      - name: Start Xvfb (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset &
      - name: Chrome cold-start probe (F-870)
        # See the `integration` job's copy of this step for the full rationale.
        # Same placement rule: after the frozen identity resolve, before the
        # first product Chrome launch, exits 0 on every path.
        shell: bash
        run: >-
          uv run python tools/chrome_cold_start_probe.py
          --cell "${{ matrix.runner_os }}-${{ matrix.runner_arch }}"
          --out "chrome-cold-start.json"
      - name: Run offline stealth lane
        # W4's stealth tests are now in this history, so the lane is no longer
        # empty and pytest's exit 5 (zero collected) is NO LONGER treated as a
        # pass. An empty selector now fails: a marker rename that silently
        # stopped collecting these tests would otherwise leave a green lane
        # asserting nothing, which is exactly the false green §8.1 forbids.
        shell: bash
        run: >-
          uv run pytest -m "stealth and not online" -v --tb=short --timeout=300
          --junitxml=junit.xml -o junit_family=xunit1
        env:
          DISPLAY: ${{ runner.os == 'Linux' && ':99' || '' }}
      - name: Emit this cell's release-evidence record
        # W5: `always()` so a RED cell still writes a record saying it was
        # red. The aggregate rejects any non-success terminal outcome, so
        # this edge can only ever make the gate redder, never greener.
        if: always()
        shell: bash
        run: >-
          uv run python tools/release_evidence.py emit
          --release-sha "$(git rev-parse HEAD)"
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --event "${{ github.event_name }}"
          --job-id offline-stealth --matrix-cell "${{ matrix.runner_os }}-${{ matrix.runner_arch }}"
          --terminal-outcome "${{ job.status }}"
          --runner-identity "runner-identity.json"
          --chrome-identity "chrome-identity.json"
          --chrome-launched
          --junit "junit.xml"
          --artifact "chrome-cold-start=chrome-cold-start.json"
          --artifact "chrome-identity=chrome-identity.json"
          --artifact "junit=junit.xml"
          --artifact "runner-identity=runner-identity.json"
      - name: Upload this cell's release-evidence record
        if: always()
        uses: DevinoSolutions/artifact/upload@44df16680dcb504375db03d284d75808db18e4ed # v1.2.1
        with:
          name: release-evidence-offline-stealth-${{ matrix.runner_os }}-${{ matrix.runner_arch }}
          path: release-evidence
          if-no-files-found: error

  # ── W3: build ONCE, verify and smoke THOSE EXACT FILES (gap G-C) ───────────
  # The only `uv build` in the entire run. Everything downstream consumes the
  # uploaded artifact; nothing rebuilds and nothing downloads this version from
  # PyPI. `python3` (not `uv run`) runs the packaging tools deliberately: they
  # are stdlib-only by design, so this job needs no dependency sync at all.
  build-dist:
    name: build-dist
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.manifest.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
      - name: Install uv
        uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Build the distribution (the ONLY build in this run)
        run: uv build
      - name: Validate metadata + package data, hash into the manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/package_verify.py manifest \
            --dist dist --out release-manifest.json
          version=$(python3 -c "import json;print(json.load(open('release-manifest.json'))['version'])")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "built version ${version}"
      - name: Assert the release tag matches the built version
        if: inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }} # via env, never interpolated into the script (T-5588)
        run: >-
          python3 tools/package_verify.py assert-version
          --manifest release-manifest.json --tag "$RELEASE_TAG"
      - name: Upload the one immutable dist artifact
        uses: DevinoSolutions/artifact/upload@44df16680dcb504375db03d284d75808db18e4ed # v1.2.1
        with:
          name: dist
          path: |
            dist
            release-manifest.json
          if-no-files-found: error
      - name: Assert qualified runner + record identity
        shell: bash
        run: >-
          python3 tools/runner_identity.py
          --runner-os "${{ runner.os }}" --runner-arch "${{ runner.arch }}"
          --runner-name "${{ runner.name }}" --expect-os "Linux"
          --expect-arch "X64" --out "runner-identity.json"
      - name: Emit this cell's release-evidence record
        # W5: `always()` so a RED cell still writes a record saying it was
        # red. The aggregate rejects any non-success terminal outcome, so
        # this edge can only ever make the gate redder, never greener.
        if: always()
        shell: bash
        run: >-
          python3 tools/release_evidence.py emit
          --release-sha "$(git rev-parse HEAD)"
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --event "${{ github.event_name }}"
          --job-id build-dist --matrix-cell "default"
          --terminal-outcome "${{ job.status }}"
          --runner-identity "runner-identity.json"
          --artifact "build-manifest=release-manifest.json"
          --artifact "runner-identity=runner-identity.json"
      - name: Upload this cell's release-evidence record
        if: always()
        uses: DevinoSolutions/artifact/upload@44df16680dcb504375db03d284d75808db18e4ed # v1.2.1
        with:
          name: release-evidence-build-dist
          path: release-evidence
          if-no-files-found: error

  # Independent re-check of the DOWNLOADED bytes, plus the negative controls
  # that prove these rules can actually fail. Distinct from installation.
  package-verify:
    name: package-verify
    needs: build-dist
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
      - name: Download the one dist artifact
        uses: DevinoSolutions/artifact/download@44df16680dcb504375db03d284d75808db18e4ed # v1.2.1
        with:
          name: dist
      - name: Verify the downloaded artifacts against the build manifest
        run: >-
          python3 tools/package_verify.py verify --dist dist
          --manifest release-manifest.json --out package-verify.json
      # ── Bite proofs. Each corrupts a THROWAWAY COPY and asserts rejection;
      # the run's real hashed artifact is never touched (corrupt_artifact.py
      # refuses to write to its source and re-checks the source size). No
      # branch, commit, push, tag, or publication is involved.
      - name: 'BITE PROOF 1/3: a flipped byte is rejected by the hash check'
        shell: bash
        run: |
          set -euo pipefail
          wheel=$(ls dist/*.whl)
          copy="bite-hash/$(basename "$wheel")"
          python3 tools/corrupt_artifact.py --source "$wheel" --out "$copy" --flip-byte
          if python3 tools/package_verify.py hash-check \
               --artifact "$copy" --manifest release-manifest.json; then
            echo "::error::hash-check ACCEPTED a corrupted artifact"
            exit 1
          fi
          echo "OK: the publish/smoke hash precondition rejects a mutated copy."
      - name: 'BITE PROOF 2/3: a wheel missing package data is rejected'
        shell: bash
        # Independent of the hash rule on purpose: the copy is re-hashed into
        # its OWN manifest, so only the membership rule can reject it.
        run: |
          set -euo pipefail
          wheel=$(ls dist/*.whl)
          sdist=$(ls dist/*.tar.gz)
          mkdir -p bite-member
          python3 tools/corrupt_artifact.py --source "$wheel" \
            --out "bite-member/$(basename "$wheel")" \
            --drop-member stealth_chrome_devtools_mcp/embedded/js/extract_styles.js
          cp "$sdist" bite-member/
          if python3 tools/package_verify.py manifest \
               --dist bite-member --out bite-member/manifest.json; then
            echo "::error::manifest ACCEPTED a wheel missing embedded/js package data"
            exit 1
          fi
          if python3 tools/package_verify.py verify \
               --dist bite-member --manifest release-manifest.json; then
            echo "::error::verify ACCEPTED a wheel missing embedded/js package data"
            exit 1
          fi
          echo "OK: a wheel that would install and then fail at runtime is rejected."
      - name: 'BITE PROOF 3/3: the publish tag precondition rejects a wrong tag'
        shell: bash
        run: |
          set -euo pipefail
          if python3 tools/package_verify.py assert-version \
               --manifest release-manifest.json --tag v0.0.0; then
            echo "::error::assert-version ACCEPTED a tag that is not the built version"
            exit 1
          fi
          echo "OK: publishing under a tag that disagrees with the artifact is blocked."
      - name: The real artifact is still intact after the bite proofs
        run: >-
          python3 tools/package_verify.py verify --dist dist
          --manifest release-manifest.json
      - name: Upload package-verify evidence
        if: always()
        uses: DevinoSolutions/artifact/upload@44df16680dcb504375db03d284d75808db18e4ed # v1.2.1
        with:
          name: package-verify-evidence
          path: |
            package-verify.json
            release-manifest.json
      - name: Assert qualified runner + record identity
        if: always()
        shell: bash
        run: >-
          python3 tools/runner_identity.py
          --runner-os "${{ runner.os }}" --runner-arch "${{ runner.arch }}"
          --runner-name "${{ runner.name }}" --expect-os "Linux"
          --expect-arch "X64" --out "runner-identity.json"
      - name: Emit this cell's release-evidence record
        # W5: `always()` so a RED cell still writes a record saying it was
        # red. The aggregate rejects any non-success terminal outcome, so
        # this edge can only ever make the gate redder, never greener.
        if: always()
        shell: bash
        run: >-
          python3 tools/release_evidence.py emit
          --release-sha "$(git rev-parse HEAD)"
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --event "${{ github.event_name }}"
          --job-id package-verify --matrix-cell "default"
          --terminal-outcome "${{ job.status }}"
          --runner-identity "runner-identity.json"
          --artifact "build-manifest=release-manifest.json"
          --artifact "package-verify=package-verify.json"
          --artifact "runner-identity=runner-identity.json"
      - name: Upload this cell's release-evidence record
        if: always()
        uses: DevinoSolutions/artifact/upload@44df16680dcb504375db03d284d75808db18e4ed # v1.2.1
        with:
          name: release-evidence-package-verify
          path: release-evidence
          if-no-files-found: error

  # Install the EXACT downloaded artifact into a fresh environment and run W1's
  # canonical journey through the launcher that install produced. Both
  # publishable artifacts on every qualified cell.
  #
  # The macOS/ARM64 cells run `--stages handshake`: install + launcher resolve +
  # initialize + tools/list + list_instances, and NO navigation. That is a
  # DECLARED PARTIAL cell, not a quiet reduction — F-773 makes any navigation
  # through the detached backend hang on hosted macOS runners, and this run
  # proved it reaches this lane too (both macOS cells, from a FRESH INSTALL of
  # the built wheel/sdist rather than the checkout: about:blank ok in 1.1s, a
  # connection to a CLOSED port hung 35.3s, fixture served nothing). It is
  # deliberately NOT an xfail and NOT continue-on-error: nothing failing is
  # marked expected-to-fail; a strictly smaller claim is made and labelled in
  # the cell NAME, in the tool's own output, and in the `known-gaps` job.
  # The stage is the ONLY difference — same tool, same harness, same journey
  # function. Flip these cells back to `full` the moment F-773 closes.
  install-smoke:
    name: install-smoke (${{ matrix.kind }} ${{ matrix.cell.runner_os }}/${{ matrix.cell.runner_arch }}${{ matrix.cell.stages == 'handshake' && ' NO-NAVIGATION partial' || '' }})
    needs: [plan, build-dist, unit-tests, coverage]
    runs-on: ${{ matrix.cell.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.install_smoke) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
      - name: Install uv
        uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install dependencies
        # Client side only: the harness needs fastmcp/psutil to DRIVE the smoke.
        # The server side under test comes exclusively from the fresh venv the
        # smoke builds out of the downloaded artifact.
        run: uv sync --locked --extra test --extra sentry
      - name: Assert qualified runner + record identity
        shell: bash
        run: >-
          uv run python tools/runner_identity.py
          --runner-os "${{ runner.os }}" --runner-arch "${{ runner.arch }}"
          --runner-name "${{ runner.name }}"
          --expect-os "${{ matrix.cell.runner_os }}"
          --expect-arch "${{ matrix.cell.runner_arch }}" --python "3.12"
          --out "runner-identity.json"
      - name: Resolve image Chrome Stable identity
        # F-819: --freeze-updater neutralises the image's background Chrome
        # updater BEFORE the version is read, so the identity recorded here is
        # the identity the browser this job launches will still report. Without
        # it, macOS Keystone can swap Chrome Stable mid-run and the CDP
        # comparison in TestChromeIdentity fails on two different binaries.
        shell: bash
        run: uv run python tools/resolve_chrome.py --freeze-updater --out chrome-identity.json
      - name: Start Xvfb (Linux headed cases only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset &
          sleep 3
      - name: Download the one dist artifact
        uses: DevinoSolutions/artifact/download@44df16680dcb504375db03d284d75808db18e4ed # v1.2.1
        with:
          name: dist
      - name: 'KNOWN GAP: this macOS cell verifies NO navigation (F-773)'
        if: matrix.cell.stages == 'handshake'
        run: |
          echo "::warning title=F-773::install-smoke (${{ matrix.kind }} macOS/ARM64) is a PARTIAL cell: it proves the artifact installs, the launcher resolves out of the fresh environment, and the server completes initialize + tools/list + list_instances. It performs NO navigation, so it makes NO macOS navigation claim. See audit/stage2/finding_F773_macos_detached_navigation.md."
      - name: Chrome cold-start probe (F-870)
        # See the `integration` job's copy of this step for the full rationale.
        # Same placement rule: after the frozen identity resolve, before the
        # first product Chrome launch, exits 0 on every path.
        #
        # Note for the macOS cells, which are `stages: handshake` partial cells
        # (F-773) and launch NO Chrome of their own: here the probe is the only
        # Chrome in the job. That is deliberate and harmless — it measures the
        # image, which is what F-870 needs, and it makes no navigation claim, so
        # the F-773 gap warning above stays exactly as true as it was.
        shell: bash
        run: >-
          uv run python tools/chrome_cold_start_probe.py
          --cell "${{ matrix.kind }}-${{ matrix.cell.runner_os }}-${{ matrix.cell.runner_arch }}"
          --out "chrome-cold-start.json"
      - name: Install the exact artifact and run W1's journey
        # Step-level env for the same reason as the integration job: the
        # `runner` context is NOT available in job-level env (actionlint).
        shell: bash
        run: >-
          uv run python tools/install_smoke.py
          --dist-dir dist --manifest release-manifest.json
          --kind "${{ matrix.kind }}"
          --stages "${{ matrix.cell.stages }}"
          --work-dir "${{ runner.temp }}/install-smoke-${{ matrix.kind }}"
          --out "install-smoke-${{ matrix.kind }}.json"
        env:
          DISPLAY: ${{ runner.os == 'Linux' && ':99' || '' }}
          # install_smoke.py is invoked directly (not via pytest), so the
          # conftest.py Sentry mute never loads; the spawned backend inherits
          # this env, keeping CI launch failures out of production telemetry.
          STEALTH_MCP_NO_ERROR_REPORTING: "true"
      - name: Upload smoke result + identity
        if: always()
        uses: DevinoSolutions/artifact/upload@44df16680dcb504375db03d284d75808db18e4ed # v1.2.1
        with:
          name: install-smoke-${{ matrix.kind }}-${{ matrix.cell.runner_os }}-${{ matrix.cell.runner_arch }}
          path: |
            install-smoke-${{ matrix.kind }}.json
            chrome-cold-start.json
            chrome-identity.json
            runner-identity.json
          if-no-files-found: warn
      - name: Emit this cell's release-evidence record
        # W5: `always()` so a RED cell still writes a record saying it was
        # red. The aggregate rejects any non-success terminal outcome, so
        # this edge can only ever make the gate redder, never greener.
        if: always()
        shell: bash
        run: >-
          uv run python tools/release_evidence.py emit
          --release-sha "$(git rev-parse HEAD)"
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --event "${{ github.event_name }}"
          --job-id install-smoke --matrix-cell "${{ matrix.kind }}-${{ matrix.cell.runner_os }}-${{ matrix.cell.runner_arch }}"
          --terminal-outcome "${{ job.status }}"
          --runner-identity "runner-identity.json"
          --chrome-identity "chrome-identity.json"
          ${{ matrix.cell.stages == 'full' && '--chrome-launched' || '' }}
          --artifact "chrome-cold-start=chrome-cold-start.json"
          --artifact "chrome-identity=chrome-identity.json"
          --artifact "install-smoke=install-smoke-${{ matrix.kind }}.json"
          --artifact "runner-identity=runner-identity.json"
      - name: Upload this cell's release-evidence record
        if: always()
        uses: DevinoSolutions/artifact/upload@44df16680dcb504375db03d284d75808db18e4ed # v1.2.1
        with:
          name: release-evidence-install-smoke-${{ matrix.kind }}-${{ matrix.cell.runner_os }}-${{ matrix.cell.runner_arch }}
          path: release-evidence
          if-no-files-found: error

  # ── W5: the fail-closed acceptance ledger (gap: "green" vs "claimable") ────
  # Every required cell above wrote one `release-evidence/v1` child record. This
  # job re-reads ALL of them through the single parser and refuses to produce a
  # successful aggregate on a missing/extra/duplicate child, a stale release SHA,
  # a foreign workflow run, a non-success terminal outcome, a required node that
  # skipped/xfailed/failed, a browser cell with no Chrome identity, a JUnit or
  # artifact hash mismatch, a malformed/duplicate/absent MQ id, or a per-tool
  # claim the run did not actually prove.
  #
  # It is a direct `needs:` edge of `release-gate` IN ADDITION to every child job
  # it validates -- never instead of them. The ledger can only ever turn a green
  # run red.
  release-evidence:
    name: release-evidence
    if: always()
    needs:
      - quality
      - unit-tests
      - coverage
      - integration
      - transport
      - known-gaps
      - offline-stealth
      - build-dist
      - package-verify
      - install-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
      - name: Install uv
        uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install dependencies
        # The aggregate derives the served tool surface from the live registry,
        # so it needs the package importable -- the count is never typed.
        run: uv sync --locked --extra test --extra sentry
      - name: Download every cell's evidence record
        uses: DevinoSolutions/artifact/download@44df16680dcb504375db03d284d75808db18e4ed # v1.2.1
        with:
          pattern: release-evidence-*
          merge-multiple: true
          path: release-evidence
      - name: Aggregate the ledger (fail-closed)
        shell: bash
        run: >-
          uv run python tools/release_evidence.py aggregate
          --root release-evidence
          --release-sha "$(git rev-parse HEAD)"
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --event "${{ github.event_name }}"
      - name: Upload the aggregate ledger
        if: always()
        uses: DevinoSolutions/artifact/upload@44df16680dcb504375db03d284d75808db18e4ed # v1.2.1
        with:
          name: release-evidence-aggregate
          path: release-evidence
          if-no-files-found: error

  # ── Stable aggregate: the ONE public required check ────────────────────────
  release-gate:
    name: release-gate
    if: always()
    needs:
      - plan
      - quality
      - unit-tests
      - coverage
      - integration
      - transport
      - known-gaps
      - offline-stealth
      - build-dist
      - package-verify
      - install-smoke
      - release-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require every edge to have succeeded
        shell: bash
        # A matrix job's result already folds ALL its cells: one failed/skipped
        # cell (fail-fast:false) makes the job result != success. The gate is red
        # unless every listed edge is exactly `success` — failure, skipped,
        # cancelled, or missing (any non-success) blocks merge.
        run: |
          overall=0
          check() {
            echo "edge $1 = $2"
            if [ "$2" != "success" ]; then overall=1; fi
          }
          check plan           "${{ needs.plan.result }}"
          check quality        "${{ needs.quality.result }}"
          check unit-tests     "${{ needs.unit-tests.result }}"
          check coverage       "${{ needs.coverage.result }}"
          check integration    "${{ needs.integration.result }}"
          check transport      "${{ needs.transport.result }}"
          check known-gaps    "${{ needs.known-gaps.result }}"
          check offline-stealth "${{ needs.offline-stealth.result }}"
          check build-dist     "${{ needs.build-dist.result }}"
          check package-verify "${{ needs.package-verify.result }}"
          check install-smoke  "${{ needs.install-smoke.result }}"
          check release-evidence "${{ needs.release-evidence.result }}"
          if [ "$overall" -ne 0 ]; then
            echo "::error::release-gate: one or more required edges were not success"
            exit 1
          fi
          echo "release-gate: all required edges succeeded"
