name: CI

on:
  push:
    branches: [main, dev]
  # Run on EVERY pull request, whatever its base — a PR stacked on a release or
  # feature branch (not just main/dev) must still get the full release gate, so
  # regressions can never slip in through a branch the filter didn't list.
  pull_request:
    branches: ['**']

# A new commit on a PR supersedes the run still going for the previous one, so
# cancel it (a full 3-OS gate per pushed commit was ~3250 wall minutes in 100
# runs). Only PR runs share a group (keyed on the PR number); every other run
# (push to main/dev, manual) falls back to its own unique run_id, so it is never
# cancelled AND never replaced while pending: GitHub drops a PENDING run of the
# same group when a newer one queues, even with cancel-in-progress false, which
# would lose the middle push's required gate. Tag runs (publish.yml) are not in
# this group at all. It lives HERE, in the caller, and not in release-gate.yml:
# a `concurrency` in a called workflow evaluates in the caller's context, so it
# would also bind publish.yml/canary.yml's calls and could cancel or deadlock
# the caller's own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The entire gate lives in the reusable workflow (plan_RELEASE W2). This caller
  # only wires the PR/push triggers to it — job semantics are NOT duplicated here.
  # W3's publish.yml calls the SAME workflow for tags. The stable required check a
  # ruleset pins is this job's aggregate child: `release-gate / release-gate`.
  release-gate:
    # Least privilege (T-5586): exactly the cap release-gate.yml declares for itself;
    # a called workflow can never exceed what its caller grants.
    permissions:
      contents: read
      id-token: write # DevinoSolutions/artifact (OIDC)
    uses: ./.github/workflows/release-gate.yml
