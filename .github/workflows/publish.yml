name: Publish to PyPI

# plan_RELEASE W3 (gap G-C): a tag publishes the ARTIFACTS THE GATE TESTED.
#
# The gate is not re-implemented here — this workflow CALLS the one reusable
# `release-gate.yml` at the tag's SHA, so the tag is qualified by exactly the
# same jobs (including the six install-smoke cells) a pull request runs. That
# call builds the distribution once and uploads it as the run's `dist` artifact;
# `publish` then DOWNLOADS those same files, re-checks their SHA-256 hashes
# against the build manifest, and uploads them. It never runs `uv build`, never
# rebuilds from the checkout, and never fetches the version from PyPI.
#
# Because `publish` needs the gate job, a failed, skipped, or cancelled cell in
# ANY gate lane leaves `needs.gate` non-success and neither PyPI nor the GitHub
# release happens.

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  # The full release gate, at the tag SHA, with the tag passed in so the gate
  # itself fails if the tag and the built artifact's metadata version disagree.
  gate:
    uses: ./.github/workflows/release-gate.yml
    with:
      ref: ${{ github.sha }}
      release_tag: ${{ github.ref_name }}

  publish:
    name: Publish the gated artifacts
    runs-on: ubuntu-latest
    needs: gate
    environment: pypi
    permissions:
      contents: write # create the GitHub release
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Download the gated dist artifact (no rebuild)
        uses: DevinoSolutions/artifact/download@v1
        with:
          name: dist

      - name: Re-check hashes, membership, and the tag/version agreement
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/package_verify.py verify \
            --dist dist --manifest release-manifest.json \
            --expect-version "${GITHUB_REF_NAME}"
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "These exact files are about to be published:"
          sha256sum dist/*

      - name: Publish to PyPI
        # F-820 release postmortem (2026-08-30): the previous pin's bundled
        # validator predated Metadata-Version 2.5, which the (unpinned) build
        # backend now emits — v2.0.7 failed twice with "InvalidDistribution:
        # '2.5' is not a valid metadata version". Same skew shape as
        # F-806/F-819: an unpinned producer drifting under a pinned validator.
        # When bumping this pin, take the current release/v1 head.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1 (2026-07-28)
        with:
          packages-dir: dist

      - name: Generate changelog
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV_TAG}..HEAD"
          fi

          : > changelog.md

          PR_NUMS=$(git log "$RANGE" --oneline --grep="(#" | \
            grep -oP '\(#\d+\)' | sort -u | tr -d '()#' || true)

          if [ -n "$PR_NUMS" ]; then
            echo "### Pull Requests" >> changelog.md
            echo "$PR_NUMS" | while read num; do
              TITLE=$(gh pr view "$num" --json title -q '.title' 2>/dev/null | tr -d '\r\n' || echo "")
              if [ -n "$TITLE" ]; then
                echo "- ${TITLE} (#${num})" >> changelog.md
              fi
            done
            echo "" >> changelog.md
          fi

          DIRECT_COMMITS=$(git log "$RANGE" --oneline | grep -v "(#" || true)
          if [ -n "$DIRECT_COMMITS" ]; then
            echo "### Commits" >> changelog.md
            echo "$DIRECT_COMMITS" | while read line; do
              echo "- ${line}" >> changelog.md
            done
          fi

          cat changelog.md
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          name: v${{ env.VERSION }}
          body_path: changelog.md
          append_body: true
          files: |
            dist/*.whl
            dist/*.tar.gz
          body: |
            ## Installation

            ```bash
            uv tool install stealth-chrome-devtools-mcp==${{ env.VERSION }}
            ```

            Or with uvx:
            ```bash
            uvx stealth-chrome-devtools-mcp
            ```
          draft: false
          prerelease: false
