<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>mixed frames: the other-origin frame</title>
</head>
<body style="margin:0">
  <!-- Served by the SECOND fixture origin (same site, other port): an in-process
       frame of another origin. See mixed_frames.html. -->
  <button id="btn-other" style="display:block;width:120px;height:40px;margin:10px">Other-origin Button</button>
  <script>
    var btn = document.getElementById('btn-other');
    window.__held = btn;
    btn.addEventListener('click', function () { parent.postMessage('click:other', '*'); });
    addEventListener('message', function (e) { if (e.data === 'remove') btn.remove(); });
  </script>
</body>
</html>
