<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>fixture-animations-page</title>
    <link rel="stylesheet" href="animations.css" />
    <!-- AUTHOR TEXT, deliberately NOT in Chrome's CSSOM serialization (F-849).
         Chrome's rule.cssText rewrites all of this: it moves the animation NAME
         to the end of the shorthand, expands `.68` to `0.68`, adds spaces after
         commas and injects `running`. An edit recipe built from cssText
         therefore matches NOTHING in this file. Every oddity below is load
         bearing -- normalizing this block would make the tests pass for the
         wrong reason, because the fixture and the assertion would then share
         one serialization. This is an inline <style> on purpose: it is the case
         where ownerNode.textContent gives us the author's real bytes. -->
    <style>
      #torture {
        width: 120px;
        height: 60px;
        animation: torture-pulse 2.4s cubic-bezier(.68,-0.55,.27,1.55) 0.3s infinite alternate both;
        transition: opacity .45s ease-in-out;
      }
      #torture::before {
        content: "";
        display: block;
        height: 4px;
        animation: torture-spin 1.2s linear infinite;
      }
      @keyframes torture-pulse {
        0%,50% { transform: scale(1) rotate(0deg); opacity: .8 }
        100%   { transform: scale(.7) rotate(-10deg); opacity: 1 }
      }
      @keyframes torture-spin {
        from { transform: rotate(0deg) }
        to   { transform: rotate(360deg) }
      }
    </style>
  </head>
  <body>
    <h1 id="page-title">ANIMATIONS</h1>
    <p id="sentinel">fixture-animations-page</p>

    <!-- Two CSS animations + a ::before animation + a transition. -->
    <div id="hero"></div>

    <!-- Styled by the inline <style> above, in author text Chrome rewrites. -->
    <div id="torture"></div>

    <ul id="stagger">
      <li class="stagger-item">one</li>
      <li class="stagger-item">two</li>
      <li class="stagger-item">three</li>
    </ul>

    <!-- element.animate(): composite + infinite iterations. v1 reported
         NOTHING at all for this, so the model was told #waapi was static. -->
    <div id="waapi"></div>

    <div id="scroller">
      <div id="scroll-bar"></div>
      <div class="spacer"></div>
    </div>

    <pre id="action-log"></pre>
    <script>
      // Kept in the page (not app.js) so the animation ground truth lives beside
      // the CSS it is asserted against.
      window.__fixtureWaapi = document.getElementById("waapi").animate(
        [
          { opacity: 0, transform: "translateY(10px)" },
          { opacity: 1, transform: "translateY(0px)" },
        ],
        {
          id: "fixture-waapi-fade",
          duration: 750,
          iterations: Infinity,
          composite: "add",
          easing: "ease-in-out",
          fill: "both",
        },
      );
    </script>
    <script src="app.js"></script>
  </body>
</html>
